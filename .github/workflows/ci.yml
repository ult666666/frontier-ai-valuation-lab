name: Model and API checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Financial regression and real HTTP API checks
        run: npm test
      - name: Independent Python parity
        run: python3 -B tests/reference_parity.py
      - name: Independent attribution and target-frontier checks
        run: python3 -B scripts/check_thesis_reference.py --output /tmp/thesis-reference.json
      - name: Independent Value Horizon and precision-boundary checks
        run: python3 -B scripts/check_horizon_reference.py --output /tmp/horizon-reference.json
      - name: Independent ownership frontier reference checks
        run: python3 -B scripts/check_ownership_reference.py --output /tmp/ownership-reference.json
      - name: Independent financing shares and equity-reconciliation checks
        run: python3 -B scripts/check_financing_reference.py --output /tmp/financing-reference.json
      - name: Independent capital strategy and finite-scenario comparisons
        run: python3 -B scripts/check_capital_reference.py --output /tmp/capital-reference.json
      - name: Independent Monte Carlo generator, copula and percentile checks
        run: python3 -B scripts/check_uncertainty_reference.py --output /tmp/uncertainty-reference.json
      - name: Build public application snapshot
        run: npm run build

  browser-parity:
    # The same seed must give byte-identical simulation JSON in Chromium and
    # in the Node API, and the Horizon curve must match the API exactly.
    # Playwright is a CI-only tool, not an app dependency.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install the pinned browser test tool
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Monte Carlo panel in a real browser against the real API
        run: |
          PORT=4341 node server.js &
          for attempt in $(seq 1 30); do curl -sf http://127.0.0.1:4341/api/health && break; sleep 1; done
          FRONTIER_BASE_URL=http://127.0.0.1:4341/ node tests/uncertainty-browser.mjs
      - name: Horizon curve in a real browser matches the API bit for bit
        run: FRONTIER_BASE_URL=http://127.0.0.1:4341/ node tests/horizon-browser.mjs
