name: Model and API checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valuation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Financial regression and real HTTP API checks
        run: npm test
      - name: Independent Python parity
        run: python3 -B tests/reference_parity.py
      - name: Independent attribution and target-frontier checks
        run: python3 -B scripts/check_thesis_reference.py --output /tmp/thesis-reference.json
      - name: Independent Value Horizon and precision-boundary checks
        run: python3 -B scripts/check_horizon_reference.py --output /tmp/horizon-reference.json
      - name: Independent financing shares and equity-reconciliation checks
        run: python3 -B scripts/check_financing_reference.py --output /tmp/financing-reference.json
      - name: Build public application snapshot
        run: npm run build
